<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="License information for freeperr.dev">
  <title>License | Freeperr</title>
  <link rel="icon" type="image/png" href="fawicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="error.css">
  <style>
    .license-content {
      max-width: 860px;
      width: 100%;
    }

    .license-title {
      font-size: clamp(80px, 18vw, 160px);
      line-height: 0.9;
      letter-spacing: -0.08em;
      font-weight: 900;
      margin-bottom: 18px;
    }

    .license-message {
      max-width: 660px;
      font-size: clamp(17px, 2vw, 21px);
      color: var(--muted);
      margin-bottom: 28px;
    }

    .license-text {
      margin: 0 0 32px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      background: transparent;
      border: 0;
      padding: 0;
      max-height: none;
      overflow: visible;
      font-size: clamp(13px, 2.8vw, 15px);
      color: var(--text);
      max-width: 760px;
    }
  </style>
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  <main class="error-page license-page">
    <section class="error-content license-content" aria-labelledby="license-title">
      <p class="license-title" id="license-title">License</p>
      <p class="license-message">This page shows the exact content of the LICENSE file used on freeperr.dev, without wrapping it in a card so it can breathe like the error pages.</p>
      <div class="error-actions">
        <a class="button primary" href="/">Return to main site</a>
        <a class="button ghost" href="/LICENSE" target="_blank" rel="noopener noreferrer">Open raw LICENSE</a>
      </div>
      <pre id="license-content" class="license-text">Loading LICENSE...</pre>
    </section>
  </main>

  <script>
    (async function loadLicense() {
      const output = document.getElementById('license-content');
      const candidates = ['/LICENSE', 'LICENSE', './LICENSE'];

      for (const url of candidates) {
        try {
          const res = await fetch(url, { cache: 'no-store' });
          if (!res.ok) continue;
          const text = await res.text();
          if (text.trim()) {
            output.textContent = text;
            return;
          }
        } catch (_) {
          // try next candidate
        }
      }

      output.textContent = 'Could not load LICENSE automatically. Use "Open raw LICENSE" above.';
    })();
  </script>
</body>
</html>
