<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>License | Freeperr</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bg: #f6f8fc;
      --card: rgba(255, 255, 255, 0.72);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --border: rgba(255,255,255,.4);

      --shadow:
        0 10px 30px rgba(15,23,42,.08);

      --shadow-xl:
        0 30px 80px rgba(15,23,42,.12);

      --radius: 34px;

      font-family:
        "Inter",
        system-ui,
        sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      position: relative;
      background:
        radial-gradient(
          circle at top left,
          rgba(59,130,246,.12),
          transparent 28%
        ),
        radial-gradient(
          circle at bottom right,
          rgba(139,92,246,.10),
          transparent 26%
        ),
        var(--bg);

      color: var(--text);
    }

    /* BACKGROUND */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .shape {
      position: absolute;
      border-radius: 999px;
      filter: blur(90px);
      opacity: .55;
      animation: floaty 18s ease-in-out infinite;
    }

    .shape-1 {
      width: 420px;
      height: 420px;
      background: #dbeafe;
      top: -120px;
      left: -80px;
    }

    .shape-2 {
      width: 360px;
      height: 360px;
      background: #ede9fe;
      right: -80px;
      bottom: 5%;
      animation-direction: reverse;
    }

    .shape-3 {
      width: 260px;
      height: 260px;
      background: #bfdbfe;
      left: 38%;
      top: 44%;
    }

    /* LAYOUT */

    main {
      width: 100%;
      height: 100vh;

      padding: 28px;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .license-shell {
      width: 100%;
      max-width: 1250px;

      height: 100%;

      display: flex;
      flex-direction: column;
      gap: 24px;

      animation:
        intro .9s cubic-bezier(.22,1,.36,1);
    }

    /* HEADER */

    .license-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 30px;
      flex-wrap: wrap;
    }

    .license-kicker {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .24em;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 12px;
    }

    .license-title {
      font-size: clamp(62px, 9vw, 118px);
      line-height: .88;
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .license-description {
      margin-top: 14px;
      max-width: 620px;

      color: var(--muted);

      font-size: 17px;
      line-height: 1.7;
    }

    /* BUTTONS */

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .button {
      height: 54px;

      padding: 0 22px;

      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.35);

      text-decoration: none;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: .22s ease;

      backdrop-filter: blur(12px);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .button.primary {
      background: #0f172a;
      color: white;
      box-shadow: var(--shadow);
    }

    .button.ghost {
      background: rgba(255,255,255,.62);
      color: var(--text);
    }

    /* LICENSE WINDOW */

    .license-window {
      position: relative;

      flex: 1;
      min-height: 0;

      display: flex;
      flex-direction: column;

      overflow: hidden;

      border-radius: var(--radius);

      border: 1px solid var(--border);

      background: var(--card);

      backdrop-filter: blur(28px);

      box-shadow: var(--shadow-xl);
    }

    .license-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 18px 24px;

      border-bottom:
        1px solid rgba(255,255,255,.35);

      background:
        rgba(255,255,255,.42);

      backdrop-filter: blur(12px);
    }

    .traffic {
      display: flex;
      gap: 8px;
    }

    .traffic span {
      width: 12px;
      height: 12px;
      border-radius: 999px;
    }

    .traffic span:nth-child(1) {
      background: #ef4444;
    }

    .traffic span:nth-child(2) {
      background: #f59e0b;
    }

    .traffic span:nth-child(3) {
      background: #10b981;
    }

    .license-file {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    /* LICENSE TEXT */

    .license-text {
      flex: 1;

      overflow: auto;

      padding:
        34px
        38px
        90px;

      white-space: pre-wrap;
      word-break: break-word;

      font-size: 14px;
      line-height: 1.9;

      color: #0f172a;

      font-family:
        "SF Mono",
        "Consolas",
        monospace;
    }

    .license-text::-webkit-scrollbar {
      width: 10px;
    }

    .license-text::-webkit-scrollbar-thumb {
      background:
        rgba(148,163,184,.55);

      border-radius: 999px;
    }

    .fade-bottom {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 100px;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          transparent,
          rgba(246,248,252,.96)
        );
    }

    /* ANIMATIONS */

    @keyframes floaty {
      0%,100% {
        transform:
          translateY(0px)
          scale(1);
      }

      50% {
        transform:
          translateY(-24px)
          scale(1.05);
      }
    }

    @keyframes intro {
      from {
        opacity: 0;

        transform:
          translateY(30px)
          scale(.985);

        filter: blur(10px);
      }

      to {
        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);
      }
    }

    /* MOBILE */

    @media (max-width: 720px) {
      main {
        padding: 14px;
      }

      .license-shell {
        gap: 16px;
      }

      .license-header {
        align-items: flex-start;
      }

      .license-title {
        font-size:
          clamp(44px, 16vw, 72px);
      }

      .license-description {
        font-size: 14px;
      }

      .actions {
        width: 100%;
      }

      .button {
        flex: 1;
      }

      .license-window {
        border-radius: 26px;
      }

      .license-text {
        padding:
          24px
          24px
          80px;

        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <div class="background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>

  <main>
    <section class="license-shell">

      <div class="license-header">
        <div>
          <p class="license-kicker">
            Open Source
          </p>

          <h1 class="license-title">
            License
          </h1>

          <p class="license-description">
            The exact LICENSE file used on freeperr.dev
          </p>
        </div>

        <div class="actions">
          <a class="button ghost" href="/">
            Return Home
          </a>

          <a
            class="button ghost"
            href="/LICENSE"
            target="_blank"
          >
            Open Raw
          </a>

          <button
            class="button primary"
            id="copy-license"
          >
            Copy License
          </button>
        </div>
      </div>

      <div class="license-window">

        <div class="license-topbar">
          <div class="traffic">
            <span></span>
            <span></span>
            <span></span>
          </div>

          <p class="license-file">
            LICENSE
          </p>
        </div>

        <pre
          id="license-content"
          class="license-text"
        >
Loading LICENSE...
        </pre>

        <div class="fade-bottom"></div>
      </div>

    </section>
  </main>

  <script>
    (async function loadLicense() {
      const output =
        document.getElementById(
          "license-content"
        );

      const candidates = [
        "/LICENSE",
        "LICENSE",
        "./LICENSE"
      ];

      for (const url of candidates) {
        try {
          const res = await fetch(url, {
            cache: "no-store"
          });

          if (!res.ok) continue;

          const text = await res.text();

          if (text.trim()) {
            output.textContent = text;
            return;
          }
        } catch (_) {}
      }

      output.textContent =
        "Could not load LICENSE automatically.";
    })();

    document
      .getElementById("copy-license")
      ?.addEventListener(
        "click",
        async () => {
          const text =
            document.getElementById(
              "license-content"
            ).textContent;

          await navigator.clipboard.writeText(
            text
          );

          const button =
            document.getElementById(
              "copy-license"
            );

          const original =
            button.textContent;

          button.textContent =
            "Copied";

          setTimeout(() => {
            button.textContent =
              original;
          }, 1800);
        }
      );
  </script>
</body>
</html>
