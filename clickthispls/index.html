<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .unlock {
      position: fixed;
      inset: 0;
      border: 0;
      padding: 0;
      color: transparent;
      background: transparent;
      cursor: default;
    }
  </style>
</head>
<body>
  <video id="rickroll" autoplay muted playsinline preload="auto">
    <source src="https://archive.org/download/MacArthur_Foundation_100andChange_dQw4w9WgXcQ/Rick_Astley_-_Never_Gonna_Give_You_Up_dQw4w9WgXcQ.mp4" type="video/mp4">
    <source src="https://archive.org/download/MacArthur_Foundation_100andChange_dQw4w9WgXcQ/Rick_Astley_-_Never_Gonna_Give_You_Up_dQw4w9WgXcQ.webm" type="video/webm">
  </video>
  <button class="unlock" id="unlock" type="button" aria-label="Enable sound and fullscreen"></button>

  <script>
    (function () {
      var video = document.getElementById("rickroll");
      var unlock = document.getElementById("unlock");

      function enterFullscreen() {
        var target = video.requestFullscreen ? video : document.documentElement;
        var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;

        if (request) {
          try {
            request.call(target);
          } catch (error) {
            // Browser ignored fullscreen without a direct user gesture.
          }
        }
      }

      function unlockExperience() {
        enterFullscreen();
        video.muted = false;
        video.volume = 1;

        var playback = video.play();
        if (playback && playback.catch) {
          playback.catch(function () {
            video.muted = true;
            video.play();
          });
        }
      }

      function startMuted() {
        video.muted = true;
        video.play();
      }

      startMuted();
      video.addEventListener("loadedmetadata", startMuted, { once: true });
      unlock.addEventListener("click", unlockExperience);
      document.addEventListener("pointerdown", unlockExperience, { once: true });
      document.addEventListener("keydown", unlockExperience, { once: true });
    })();
  </script>
</body>
</html>
