<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .unlock {
      position: fixed;
      inset: auto 16px 16px auto;
      min-width: 132px;
      border: 0;
      border-radius: 999px;
      padding: 12px 16px;
      color: #000;
      background: #fff;
      font: 800 14px/1 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease;
    }

    .unlock.is-visible {
      opacity: 1;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <video id="rickroll" autoplay playsinline preload="auto">
    <source src="./rickroll.mp4" type="video/mp4">
  </video>
  <button class="unlock" id="unlock" type="button" aria-label="Enable sound and fullscreen">Ton an</button>

  <script>
    (function () {
      var video = document.getElementById("rickroll");
      var unlock = document.getElementById("unlock");

      function enterFullscreen() {
        var target = video.requestFullscreen ? video : document.documentElement;
        var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;

        if (request) {
          try {
            request.call(target);
          } catch (error) {
            // Browser ignored fullscreen without a direct user gesture.
          }
        }
      }

      function unlockExperience() {
        unlock.classList.remove("is-visible");
        enterFullscreen();
        video.muted = false;
        video.volume = 1;

        var playback = video.play();
        if (playback && playback.catch) {
          playback.catch(function () {
            video.muted = true;
            video.play();
            unlock.classList.add("is-visible");
          });
        }
      }

      function start() {
        video.muted = false;
        video.volume = 1;

        var playback = video.play();
        if (playback && playback.catch) {
          playback.catch(function () {
            video.muted = true;
            video.play();
            unlock.classList.add("is-visible");
          });
        }
      }

      start();
      video.addEventListener("loadedmetadata", start, { once: true });
      unlock.addEventListener("click", unlockExperience);
      document.addEventListener("pointerdown", unlockExperience, { once: true });
      document.addEventListener("keydown", unlockExperience, { once: true });
    })();
  </script>
</body>
</html>
