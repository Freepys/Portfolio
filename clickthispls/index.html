<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#000000">
  <title>...</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      width: 100vw;
      height: 100vh;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .unlock {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      border: 0;
      color: #fff;
      background: rgba(0, 0, 0, 0.04);
      font: 700 18px/1.2 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
    }

    .unlock.is-visible {
      display: grid;
    }
  </style>
</head>
<body>
  <video id="rickroll" autoplay controls preload="auto">
    <source src="https://archive.org/download/MacArthur_Foundation_100andChange_dQw4w9WgXcQ/Rick_Astley_-_Never_Gonna_Give_You_Up_dQw4w9WgXcQ.mp4" type="video/mp4">
    <source src="https://archive.org/download/MacArthur_Foundation_100andChange_dQw4w9WgXcQ/Rick_Astley_-_Never_Gonna_Give_You_Up_dQw4w9WgXcQ.webm" type="video/webm">
  </video>
  <button class="unlock" id="unlock" type="button" aria-label="Play video">Click</button>

  <script>
    (function () {
      var video = document.getElementById("rickroll");
      var unlock = document.getElementById("unlock");

      function enterFullscreen() {
        var target = video.requestFullscreen ? video : document.documentElement;
        var request = target.requestFullscreen || target.webkitRequestFullscreen || target.msRequestFullscreen;

        if (request) {
          try {
            request.call(target);
          } catch (error) {
            // Browser ignored fullscreen without a direct user gesture.
          }
        }
      }

      function play() {
        unlock.classList.remove("is-visible");
        enterFullscreen();

        var playback = video.play();
        if (playback && playback.catch) {
          playback.catch(function () {
            unlock.classList.add("is-visible");
          });
        }
      }

      video.addEventListener("loadedmetadata", play, { once: true });
      unlock.addEventListener("click", play);
      document.addEventListener("pointerdown", play, { once: true });
      document.addEventListener("keydown", play, { once: true });
    })();
  </script>
</body>
</html>
