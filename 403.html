<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>403 | Freeperr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/fawicon.png">
  <link rel="stylesheet" href="/error.css">
</head>
<body>
  <main class="error-shell">
    <div class="error-shape one" aria-hidden="true"></div>
    <div class="error-shape two" aria-hidden="true"></div>
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-badge">Access Blocked</p>
      <p class="error-code">403</p>
      <h1 class="error-title" id="error-title">Forbidden</h1>
      <p class="error-message">You reached a page that exists, but it is not available from here. The safest next step is to return to the main site and navigate from the public sections.</p>
      <div class="error-actions">
        <a class="button primary" href="/">Return to main site</a>
        <a class="button secondary" href="/#work">See featured work</a>
      </div>
      <div class="error-meta" aria-label="Helpful hints">
        <span class="error-pill">Permission denied</span>
        <span class="error-pill">Public route unavailable</span>
      </div>
    </section>
  </main>
</body>
</html>
