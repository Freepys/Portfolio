<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>403 | Freeperr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="fawicon.png">
  <link rel="stylesheet" href="error.css">
</head>
<body>
  <div class="background" aria-hidden="true">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
    <div class="shape shape-3"></div>
  </div>
  <main class="error-page">
    <section class="error-content" aria-labelledby="error-title">
      <p class="error-code">403</p>
      <h1 class="error-title" id="error-title">Forbidden</h1>
      <p class="error-message">You reached a page that exists, but it is not available from here. The safest next step is to return to the main site and navigate from the public sections.</p>
      <div class="error-actions">
        <a class="button primary" href="/">Return to main site</a>
        <a class="button ghost" href="javascript:history.back()">Go back</a>
      </div>
    </section>
  </main>
</body>
</html>
