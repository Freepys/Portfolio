<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>401 | Freeperr</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/fawicon.png">
  <link rel="stylesheet" href="/error.css">
</head>
<body>
  <main class="error-shell">
    <div class="error-shape one" aria-hidden="true"></div>
    <div class="error-shape two" aria-hidden="true"></div>
    <section class="error-card" aria-labelledby="error-title">
      <p class="error-badge">Access Required</p>
      <p class="error-code">401</p>
      <h1 class="error-title" id="error-title">Unauthorized</h1>
      <p class="error-message">This page requires authorization before it can be opened. If you reached this by accident, head back to the main site and continue from there.</p>
      <div class="error-actions">
        <a class="button primary" href="/">Return to main site</a>
        <a class="button secondary" href="/#contact">Go to contact section</a>
      </div>
      <div class="error-meta" aria-label="Helpful hints">
        <span class="error-pill">Login or access missing</span>
        <span class="error-pill">Check the original link</span>
      </div>
    </section>
  </main>
</body>
</html>
